<!DOCTYPE html>
<head>
    <title>Home Page</title>
      <link rel="stylesheet" href="HomeStyleSheet.css">

</head>
<body background="background.png">
    <div class="home">
        <h1>Welcome</h1>
        <h2>FindYourPath</h2>
        <p>Real Guidance.<br>Local Mentors.<br>Brighter Futures</p>
    </div>

    <!-- =====================================================Log in===================================================== -->
    <div class="login-box">
        <h2>Login</h2>
        <form action="#" method="post" onsubmit="return validateForm()">
            <label><b>Username:</b></label><br>
            <input labe type="text" id="username" name="username"><br><br><br><br>
            <label><b>Password</b></label><br>
            <input type="password" id="password" name="password">
            <label><a href="ForgotPassword.html"><b style="color: blue;">Forgot Password?</b></a></label><br>
            <button type="submit"><b>Login</b></button>
        </form>
        <p>Don't have an account? <a href="Register.html" style="color: blue;">Sign up</a></p>
    </div>
	<script>
		function validateForm() {
			const username = document.getElementById('username').value.trim();
			const password = document.getElementById('password').value.trim();

			if (username === '' || password === '') {
				alert('Please enter both username and password.');
				return false;   
			}

			window.location.href = 'Dashboard.html';
			return false;   
		}
		</script>
</body>
</html>
