<!DOCTYPE html>
<html>
<head>
    <title>Home Page</title>
    <link rel="stylesheet" href="HomeStyleSheet.css">
</head>
<body background="background.png">
<div class="home">
    <h1>Welcome</h1>
    <h2>FindYourPath</h2>
    <p>Real Guidance.<br>Local Mentors.<br>Brighter Futures</p>
</div>

<!-- =====================================================Log in===================================================== -->
<div class="login-box">
    <h2>Login</h2>
    <form id="loginForm">   <!-- removed onsubmit -->
        <label><b>Username:</b></label><br>
        <input type="text" id="username" name="username"><br><br><br><br>
        <label><b>Password</b></label><br>
        <input type="password" id="password" name="password">
        <label><a href="ForgotPassword.html"><b style="color: blue;">Forgot Password?</b></a></label><br>
        <button type="submit"><b>Login</b></button>
    </form>
    <p>Don't have an account? <a href="Register.html" style="color: blue;">Sign up</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>

<script>
    const form = document.getElementById('loginForm');

    form.addEventListener('submit', async function (e) {
        e.preventDefault();   // stops the page from reloading

        const email = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        if (email === '' || password === '') {
            alert('Please enter both email and password.');
            return;
        }

        // Real Supabase login
        const { data, error } = await sb.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            alert('Invalid email or password');
            console.error(error);
            return;
        }

        const { data: profile, error: profileError } = await sb
            .from('profiles')
            .select('full_name, role, cell_number, email')
            .eq('id', data.user.id)
            .single();

        if (profileError || !profile) {
            alert('Profile not found');
            console.error(profileError);
            return;
        }

        // Save user info
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('careerUser', JSON.stringify({
            fullname: profile.full_name,
            role: profile.role,
            cell: profile.cell_number,
            email: profile.email,
            id: data.user.id
        }));

        // Redirect based on role
        if (profile.role === 'Mentor') {
            window.location.href = 'MentorDashboard.html';
        } else {
            window.location.href = 'Dashboard.html';
        }
    });
</script>
</body>
</html>
