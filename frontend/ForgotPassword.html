<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password</title>

    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

    <style>

        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
          font-family: 'Inter', sans-serif;
        }


        /* =========================
           BODY
        ========================= */

        body {
          height: 100vh;
          display: flex;
          justify-content: center;
          align-items: center;

          overflow: hidden;
          position: relative;

          background:
            linear-gradient(
              135deg,
              #02254b 0%,
              #03264c 40%,
              #02254b 100%
            );
        }


        /* =========================
           GREEN GLOW
        ========================= */

        body::before {
          content: "";

          position: absolute;

          width: 850px;
          height: 850px;

          background:
            radial-gradient(
              circle,
              rgba(72,255,94,0.30) 0%,
              rgba(72,255,94,0.12) 25%,
              rgba(72,255,94,0.05) 40%,
              transparent 70%
            );

          filter: blur(60px);

          transform: scale(1.15);

          z-index: 0;
        }


        /* =========================
           X / TRIANGLE LIGHT EFFECT
        ========================= */

        body::after {
          content: "";

          position: absolute;

          width: 140%;
          height: 140%;

          background:

            linear-gradient(
              45deg,
              transparent 0%,
              transparent 42%,
              rgba(0,255,120,0.10) 50%,
              transparent 58%,
              transparent 100%
            ),

            linear-gradient(
              -45deg,
              transparent 0%,
              transparent 42%,
              rgba(0,255,120,0.10) 50%,
              transparent 58%,
              transparent 100%
            ),

            linear-gradient(
              135deg,
              transparent 0%,
              transparent 42%,
              rgba(0,255,120,0.08) 50%,
              transparent 58%,
              transparent 100%
            ),

            linear-gradient(
              -135deg,
              transparent 0%,
              transparent 42%,
              rgba(0,255,120,0.08) 50%,
              transparent 58%,
              transparent 100%
            );

          opacity: 0.9;

          filter: blur(10px);

          transform: scale(1.2);

          z-index: 1;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .reset-container {
          width: 400px;

          padding: 35px 40px;

          border-radius: 14px;

          background: rgba(255,255,255,0.28);

          backdrop-filter: blur(6px);

          box-shadow:
            0 8px 25px rgba(0,0,0,0.2);

          display: flex;
          flex-direction: column;
          align-items: center;

          position: relative;

          z-index: 10;
        }


        /* =========================
           PROFILE ICON
        ========================= */

        .profile-icon {
          width: 88px;
          height: 88px;

          border-radius: 50%;

          background: #ddd0f1;

          display: flex;
          justify-content: center;
          align-items: center;

          margin-bottom: 25px;
        }

        .profile-icon i {
          font-size: 42px;
          color: #0b2d4f;
        }


        /* =========================
           FORM
        ========================= */

        form {
          width: 100%;
        }


        .input-group {
          margin-bottom: 18px;
        }


        .input-group label {
          display: block;

          font-size: 15px;

          font-weight: 700;

          color: #000;

          margin-bottom: 8px;
        }


        /* =========================
           NORMAL INPUT
        ========================= */

        .input-group input {
          width: 100%;

          border: none;
          outline: none;

          background: rgba(255,255,255,0.18);

          padding: 12px 10px;

          border-bottom: 4px solid #0b2d4f;

          font-size: 15px;

          color: #111;

          transition: 0.3s;
        }


        .input-group input::placeholder {
          color: #444;
        }


        .input-group input:focus {
          border-bottom-color: #66b032;
        }


        /* =========================
           PASSWORD FIELD
        ========================= */

        .password-wrapper {
          position: relative;

          width: 100%;
        }


        .password-wrapper input {
          padding-right: 45px;
        }


        /* =========================
           EYE BUTTON
        ========================= */

        .eye-btn {
          position: absolute;

          right: 8px;

          top: 50%;

          transform: translateY(-50%);

          border: none;

          background: transparent;

          color: #0b2d4f;

          font-size: 18px;

          cursor: pointer;

          padding: 5px;

          transition: 0.2s;
        }


        .eye-btn:hover {
          color: #66b032;
        }


        .eye-btn:focus {
          outline: none;
        }


        /* =========================
           ERROR / SUCCESS INPUT
        ========================= */

        .input-error {
          border-bottom-color: #e53935 !important;
        }


        .input-success {
          border-bottom-color: #66b032 !important;
        }


        /* =========================
           ERROR MESSAGE
        ========================= */

        .error-message {
          display: none;

          color: #d60000;

          font-size: 13px;

          font-weight: 700;

          margin-top: 6px;
        }


        /* =========================
           SUCCESS MESSAGE
        ========================= */

        .success-message {
          display: none;

          width: 100%;

          padding: 12px;

          margin-bottom: 15px;

          border-radius: 8px;

          background: rgba(76,175,80,0.20);

          color: #146b18;

          text-align: center;

          font-weight: 700;
        }


        /* =========================
           RESET BUTTON
        ========================= */

        .reset-btn {
          width: 65%;

          margin: 20px auto 10px;

          display: block;

          border: none;

          outline: none;

          background: #66b032;

          color: white;

          padding: 12px;

          border-radius: 30px;

          font-size: 24px;

          font-weight: 700;

          cursor: pointer;

          transition: 0.3s;
        }


        .reset-btn:hover {
          background: #5aa02c;

          transform: scale(1.03);
        }


        .reset-btn:active {
          transform: scale(0.98);
        }


        /* =========================
           BOTTOM TEXT
        ========================= */

        .bottom-text {
          margin-top: 12px;

          text-align: center;

          font-size: 15px;

          color: #123;

          font-weight: 600;
        }


        .bottom-text a {
          text-decoration: none;

          color: #0077ff;

          font-weight: 700;
        }


        .bottom-text a:hover {
          text-decoration: underline;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media(max-width:480px) {

          .reset-container {
            width: 90%;

            padding: 30px 22px;
          }


          .reset-btn {
            width: 100%;
          }

        }

    </style>
</head>

<body>

<div class="reset-container">

    <div class="profile-icon">
        <i class="fas fa-lock"></i>
    </div>


    <form id="resetForm">

        <!-- SUCCESS MESSAGE -->
        <div
                id="successMessage"
                class="success-message">
        </div>


        <!-- EMAIL -->
        <div class="input-group">

            <label for="email">
                Email Address
            </label>

            <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
            >

            <div
                    id="emailError"
                    class="error-message">
            </div>

        </div>


        <!-- NEW PASSWORD -->
        <div class="input-group">

            <label for="newPassword">
                New Password
            </label>

            <div class="password-wrapper">

                <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter your new password"
                        minlength="6"
                        required
                >

                <button
                        type="button"
                        class="eye-btn"
                        onclick="togglePassword('newPassword', this)"
                        aria-label="Show password"
                >
                    <i class="fas fa-eye"></i>
                </button>

            </div>

            <div
                    id="passwordError"
                    class="error-message">
            </div>

        </div>


        <!-- CONFIRM PASSWORD -->
        <div class="input-group">

            <label for="confirmPassword">
                Confirm Password
            </label>

            <div class="password-wrapper">

                <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your new password"
                        minlength="6"
                        required
                >

                <button
                        type="button"
                        class="eye-btn"
                        onclick="togglePassword('confirmPassword', this)"
                        aria-label="Show password"
                >
                    <i class="fas fa-eye"></i>
                </button>

            </div>

            <div
                    id="confirmError"
                    class="error-message">
            </div>

        </div>


        <button
                type="submit"
                class="reset-btn">
            Reset
        </button>

    </form>


    <div class="bottom-text">

        Remember your password?

        <a href="Login.html">
            Login
        </a>

    </div>

</div>


<!-- ==================================================
     SUPABASE CONNECTION
     SAME AS YOUR ENCOURAGEMENT WALL
     ================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabaseClient.js"></script>


<script>

    /*
    =====================================================
    CHECK THAT YOUR SUPABASE CLIENT LOADED
    =====================================================
    */

    if (!window.sb) {

      console.error(
        "supabaseClient.js did not create window.sb"
      );

    }


    /*
    =====================================================
    GET ELEMENTS
    =====================================================
    */

    const form =
      document.getElementById("resetForm");

    const email =
      document.getElementById("email");

    const newPassword =
      document.getElementById("newPassword");

    const confirmPassword =
      document.getElementById("confirmPassword");

    const emailError =
      document.getElementById("emailError");

    const passwordError =
      document.getElementById("passwordError");

    const confirmError =
      document.getElementById("confirmError");

    const successMessage =
      document.getElementById("successMessage");

    const resetButton =
      document.querySelector(".reset-btn");


    /*
    =====================================================
    SHOW / HIDE PASSWORD
    =====================================================
    */

    function togglePassword(inputId, button) {

      const input =
        document.getElementById(inputId);

      const icon =
        button.querySelector("i");


      if (input.type === "password") {

        input.type = "text";

        icon.classList.remove("fa-eye");

        icon.classList.add("fa-eye-slash");

        button.setAttribute(
          "aria-label",
          "Hide password"
        );

      } else {

        input.type = "password";

        icon.classList.remove("fa-eye-slash");

        icon.classList.add("fa-eye");

        button.setAttribute(
          "aria-label",
          "Show password"
        );

      }

    }


    /*
    =====================================================
    PASSWORD MATCHING
    =====================================================
    */

    function checkPasswords() {

      if (confirmPassword.value === "") {

        confirmError.style.display = "none";

        confirmPassword.classList.remove(
          "input-error",
          "input-success"
        );

        return;
      }


      if (
        newPassword.value !==
        confirmPassword.value
      ) {

        confirmError.textContent =
          "Passwords do not match.";

        confirmError.style.display =
          "block";

        confirmPassword.classList.add(
          "input-error"
        );

        confirmPassword.classList.remove(
          "input-success"
        );

      } else {

        confirmError.style.display =
          "none";

        confirmPassword.classList.remove(
          "input-error"
        );

        confirmPassword.classList.add(
          "input-success"
        );

      }

    }


    newPassword.addEventListener(
      "input",
      checkPasswords
    );

    confirmPassword.addEventListener(
      "input",
      checkPasswords
    );


    /*
    =====================================================
    RESET PASSWORD
    =====================================================
    */

    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        /*
        Clear old messages
        */

        emailError.style.display =
          "none";

        passwordError.style.display =
          "none";

        confirmError.style.display =
          "none";

        successMessage.style.display =
          "none";


        email.classList.remove(
          "input-error",
          "input-success"
        );

        newPassword.classList.remove(
          "input-error",
          "input-success"
        );

        confirmPassword.classList.remove(
          "input-error",
          "input-success"
        );


        let valid = true;


        /*
        EMAIL
        */

        if (!email.checkValidity()) {

          emailError.textContent =
            "Please enter a valid email address.";

          emailError.style.display =
            "block";

          email.classList.add(
            "input-error"
          );

          valid = false;

        } else {

          email.classList.add(
            "input-success"
          );

        }


        /*
        PASSWORD
        */

        if (newPassword.value.length < 6) {

          passwordError.textContent =
            "Password must be at least 6 characters.";

          passwordError.style.display =
            "block";

          newPassword.classList.add(
            "input-error"
          );

          valid = false;

        } else {

          newPassword.classList.add(
            "input-success"
          );

        }


        /*
        CONFIRM PASSWORD
        */

        if (
          newPassword.value !==
          confirmPassword.value
        ) {

          confirmError.textContent =
            "Passwords do not match.";

          confirmError.style.display =
            "block";

          confirmPassword.classList.add(
            "input-error"
          );

          valid = false;

        } else {

          confirmPassword.classList.add(
            "input-success"
          );

        }


        if (!valid) {
          return;
        }


        resetButton.disabled = true;

        resetButton.textContent =
          "Resetting...";


        try {

          /*
          =================================================
          IMPORTANT:
          Use window.sb, exactly like your
          EncouragementWall.js does.
          =================================================
          */

          if (!window.sb) {

            throw new Error(
              "Supabase connection could not be loaded. Check supabaseClient.js."
            );

          }


          /*
          =================================================
          GET THE USER FROM THE PASSWORD RESET SESSION
          =================================================
          */

          const {
            data: { user },
            error: userError
          } =
            await window.sb.auth.getUser();


          if (userError) {

            throw new Error(
              userError.message
            );

          }


          if (!user) {

            throw new Error(
              "The password reset link is invalid or has expired. Please request a new reset email."
            );

          }


          /*
          =================================================
          CHECK EMAIL
          =================================================
          */

          const accountEmail =
            (user.email || "")
              .toLowerCase()
              .trim();

          const enteredEmail =
            email.value
              .toLowerCase()
              .trim();


          if (
            accountEmail !==
            enteredEmail
          ) {

            emailError.textContent =
              "The email address does not match this account.";

            emailError.style.display =
              "block";

            email.classList.add(
              "input-error"
            );

            return;
          }


          /*
          =================================================
          CHANGE PASSWORD
          =================================================
          */

          const {
            error: updateError
          } =
            await window.sb.auth.updateUser({
              password: newPassword.value
            });


          if (updateError) {

            throw new Error(
              updateError.message
            );

          }


          /*
          =================================================
          UPDATE PROFILE TABLE
          =================================================

          This part is optional for changing the password.

          It will update password_changed_at if that
          column exists in your profiles table.
          */

          const {
            error: profileError
          } =
            await window.sb
              .from("profiles")
              .update({
                password_changed_at:
                  new Date().toISOString()
              })
              .eq("id", user.id);


          if (profileError) {

            console.error(
              "Profile update error:",
              profileError
            );

            /*
            The password was already changed,
            so don't tell the user that the
            password reset failed.
            */

          }


          /*
          =================================================
          SUCCESS
          =================================================
          */

          successMessage.textContent =
            "Password reset successfully!";

          successMessage.style.display =
            "block";


          newPassword.value = "";

          confirmPassword.value = "";


          /*
          =================================================
          GO TO HOME
          =================================================
          */

          setTimeout(function() {

            window.location.href =
              "Home.html";

          }, 2000);


        } catch (error) {

          console.error(
            "Reset password error:",
            error
          );


          passwordError.textContent =
            error.message;

          passwordError.style.display =
            "block";


        } finally {

          resetButton.disabled =
            false;

          resetButton.textContent =
            "Reset";

        }

      }
    );

</script>

</body>
</html>
