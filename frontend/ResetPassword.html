<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — FindYourPath</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }

        /* Light background: plain gradients, no blur layers (the old blurred 850px / 140% layers caused the lag) */
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                    radial-gradient(600px circle at 50% 42%, rgba(72,255,94,.22), transparent 70%),
                    linear-gradient(135deg, #02254b 0%, #03264c 40%, #02254b 100%);
        }

        .reset-container {
            width: min(420px, 100%);
            padding: 36px 40px 30px;
            border-radius: 16px;
            background: rgba(255,255,255,.95);
            box-shadow: 0 12px 32px rgba(0,0,0,.28);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-icon { width: 76px; height: 76px; border-radius: 50%; background: #e8f5e9; display: flex; justify-content: center; align-items: center; margin-bottom: 18px; }
        .profile-icon i { font-size: 34px; color: #0b2d4f; }

        h1 { font-size: 1.5rem; color: #0b2d4f; margin-bottom: 6px; text-align: center; }
        .sub { font-size: .9rem; color: #475569; text-align: center; margin-bottom: 22px; }

        form { width: 100%; }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: .85rem; font-weight: 700; color: #0f172a; margin-bottom: 6px; }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            background: #fff;
            font-size: .95rem;
            color: #111;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }
        .input-group input:focus { border-color: #66b032; box-shadow: 0 0 0 3px rgba(102,176,50,.2); }
        .input-group input[readonly] { background: #f1f5f9; color: #475569; }
        .input-group input.input-error { border-color: #e53935; }
        .input-group input.input-success { border-color: #66b032; }

        /* Show/hide eye */
        .password-wrapper { position: relative; }
        .password-wrapper input { padding-right: 48px; }
        /* Hide the browser's own built-in eye (Edge/IE) so there is only one */
        .password-wrapper input::-ms-reveal,
        .password-wrapper input::-ms-clear { display: none; }
        .eye-btn {
            position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
            width: 36px; height: 36px; border: none; border-radius: 8px; background: transparent;
            color: #0b2d4f; font-size: 1rem; cursor: pointer; transition: color .2s, background .2s;
        }
        .eye-btn:hover { color: #66b032; background: #f1f5f9; }
        .eye-btn:focus-visible { outline: 3px solid rgba(102,176,50,.45); }

        .rules { list-style: none; margin-top: 10px; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .78rem; color: #64748b; }
        .rules li::before { content: '○ '; }
        .rules li.ok { color: #2e7d32; font-weight: 600; }
        .rules li.ok::before { content: '✓ '; }

        .error-message { display: none; color: #c62828; font-size: .85rem; font-weight: 600; margin: 4px 0 12px; }
        .error-message.show { display: block; }
        .match-hint { font-size: .8rem; margin-top: 6px; min-height: 1em; }
        .match-hint.bad { color: #c62828; }
        .match-hint.good { color: #2e7d32; }

        .status { width: 100%; padding: 12px 14px; margin-bottom: 16px; border-radius: 10px; font-size: .9rem; font-weight: 600; text-align: center; }
        .status.success { background: #e8f5e9; color: #1b5e20; }
        .status.error { background: #fdecea; color: #b71c1c; }
        .status[hidden], form[hidden] { display: none; }

        .reset-btn {
            width: 100%; display: block; border: none; background: #66b032; color: #fff;
            padding: 13px; border-radius: 30px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background .2s;
        }
        .reset-btn:hover:not(:disabled) { background: #5aa02c; }
        .reset-btn:disabled { background: #a9c99a; cursor: not-allowed; }
        .reset-btn:focus-visible { outline: 3px solid rgba(11,45,79,.4); outline-offset: 2px; }

        .bottom-text { margin-top: 18px; text-align: center; font-size: .9rem; color: #334155; font-weight: 600; }
        .bottom-text a { text-decoration: none; color: #0b57d0; font-weight: 700; }
        .bottom-text a:hover { text-decoration: underline; }

        @media (max-width: 480px) { .reset-container { padding: 28px 20px 24px; } }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
</head>
<body>

<main class="reset-container">
    <div class="profile-icon"><i class="fas fa-lock"></i></div>
    <h1>Reset your password</h1>
    <p class="sub" id="sub">Checking your reset link…</p>

    <div id="statusBox" class="status" role="status" aria-live="polite" hidden></div>

    <!-- Step 1 (only when there is no valid reset link): ask for the email and send a link -->
    <form id="requestForm" novalidate hidden>
        <div class="input-group">
            <label for="requestEmail">Email address</label>
            <input type="email" id="requestEmail" placeholder="Enter your account email" autocomplete="email" required>
        </div>
        <div id="requestError" class="error-message" role="alert"></div>
        <button type="submit" class="reset-btn" id="requestButton">Send reset link</button>
    </form>

    <!-- Step 2 (opened from the link in the email): choose the new password -->
    <form id="resetForm" novalidate hidden>
        <div class="input-group">
            <label for="email">Account email</label>
            <input type="email" id="email" readonly>
        </div>

        <div class="input-group">
            <label for="newPassword">New password</label>
            <div class="password-wrapper">
                <input type="password" id="newPassword" placeholder="Enter a new password" autocomplete="new-password" required>
                <button type="button" class="eye-btn" data-target="newPassword" aria-label="Show password" aria-pressed="false"><i class="fas fa-eye"></i></button>
            </div>
            <ul class="rules" id="rules" aria-live="polite">
                <li data-rule="len">8+ characters</li>
                <li data-rule="letter">A letter</li>
                <li data-rule="number">A number</li>
            </ul>
        </div>

        <div class="input-group">
            <label for="confirmPassword">Confirm password</label>
            <div class="password-wrapper">
                <input type="password" id="confirmPassword" placeholder="Confirm your new password" autocomplete="new-password" required>
                <button type="button" class="eye-btn" data-target="confirmPassword" aria-label="Show password" aria-pressed="false"><i class="fas fa-eye"></i></button>
            </div>
            <div class="match-hint" id="matchHint" aria-live="polite"></div>
        </div>

        <div id="formError" class="error-message" role="alert"></div>

        <button type="submit" class="reset-btn" id="resetButton" disabled>Reset password</button>
    </form>

    <div class="bottom-text">Remember your password? <a href="Home.html">Login</a></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<script>
    (function () {
        const $ = (id) => document.getElementById(id);
        const client = window.sb;               // created by supabaseClient.js
        const form = $('resetForm'), requestForm = $('requestForm');
        const statusBox = $('statusBox'), sub = $('sub');
        const pw = $('newPassword'), confirmPw = $('confirmPassword');
        const btn = $('resetButton'), formError = $('formError'), matchHint = $('matchHint');
        const requestBtn = $('requestButton'), requestError = $('requestError');
        let currentUser = null;

        /* Read the link BEFORE Supabase cleans the address bar */
        const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
        const queryParams = new URLSearchParams(window.location.search);
        const linkError = hashParams.get('error_description') || queryParams.get('error_description') ||
            hashParams.get('error_code') || queryParams.get('error_code');
        const hadToken = hashParams.get('type') === 'recovery' || hashParams.has('access_token') ||
            queryParams.has('code') || queryParams.has('token_hash');

        /* ---------- show / hide password (one handler for both eyes) ---------- */
        document.addEventListener('click', (e) => {
            const eye = e.target.closest('.eye-btn');
            if (!eye) return;
            const input = $(eye.dataset.target);
            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            eye.querySelector('i').className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
            eye.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
            eye.setAttribute('aria-pressed', String(show));
            input.focus();
        });

        /* ---------- live checks ---------- */
        const rules = {
            len: (v) => v.length >= 8,
            letter: (v) => /[A-Za-z]/.test(v),
            number: (v) => /\d/.test(v)
        };
        const passwordOk = (v) => Object.values(rules).every((fn) => fn(v));

        function refresh() {
            document.querySelectorAll('#rules li').forEach((li) => li.classList.toggle('ok', rules[li.dataset.rule](pw.value)));

            const matching = confirmPw.value !== '' && pw.value === confirmPw.value;
            if (confirmPw.value === '') { matchHint.textContent = ''; matchHint.className = 'match-hint'; }
            else if (matching) { matchHint.textContent = 'Passwords match'; matchHint.className = 'match-hint good'; }
            else { matchHint.textContent = 'Passwords do not match'; matchHint.className = 'match-hint bad'; }

            pw.classList.toggle('input-success', passwordOk(pw.value));
            confirmPw.classList.toggle('input-success', matching);
            confirmPw.classList.toggle('input-error', confirmPw.value !== '' && !matching);
            btn.disabled = !(passwordOk(pw.value) && matching);
            formError.classList.remove('show');
        }
        pw.addEventListener('input', refresh);
        confirmPw.addEventListener('input', refresh);

        /* ---------- screens ---------- */
        function showStatus(text, type) { statusBox.textContent = text; statusBox.className = 'status ' + type; statusBox.hidden = false; }

        // Valid reset link: show the "choose a new password" form
        function showForm(user) {
            if (currentUser) return;
            currentUser = user;
            $('email').value = user.email || '';
            statusBox.hidden = true;
            requestForm.hidden = true;
            sub.textContent = 'Choose a new password for your account.';
            form.hidden = false;
            pw.focus();
        }

        // No valid reset link: let the person ask for a new one right here
        function showRequest() {
            if (currentUser) return;
            form.hidden = true;
            if (linkError) {
                sub.textContent = 'Enter your email below to get a new reset link.';
                showStatus('This reset link has expired or was already used.', 'error');
            } else {
                sub.textContent = 'Enter your email and we will send you a link to reset your password.';
                statusBox.hidden = true;
            }
            requestForm.hidden = false;
            $('requestEmail').focus();
        }

        function showFatal(message) {
            form.hidden = true;
            requestForm.hidden = true;
            sub.textContent = '';
            showStatus(message, 'error');
        }

        async function init() {
            if (!client) { showFatal('We could not connect to the server. Please try again later.'); console.error('supabaseClient.js did not create window.sb'); return; }

            // A reset link was opened but it is bad or expired: no need to wait
            if (linkError && !hadToken) { showRequest(); return; }

            // Supabase reads the reset link and fires PASSWORD_RECOVERY
            client.auth.onAuthStateChange((event, session) => {
                if (session && session.user && event === 'PASSWORD_RECOVERY') showForm(session.user);
            });

            const { data } = await client.auth.getSession();
            if (data && data.session && data.session.user && hadToken) { showForm(data.session.user); return; }

            // Opened without a link: after a short wait, offer the email form
            setTimeout(() => { if (!currentUser) showRequest(); }, hadToken ? 4000 : 400);
        }

        /* ---------- send the reset email ---------- */
        requestForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            requestError.classList.remove('show');

            const email = $('requestEmail').value.trim();
            if (!/^\S+@\S+\.\S+$/.test(email)) {
                requestError.textContent = 'Please enter a valid email address.';
                requestError.classList.add('show');
                return;
            }

            requestBtn.disabled = true;
            requestBtn.textContent = 'Sending…';

            try {
                // Link in the email brings the person back to this page
                const redirectTo = new URL('ResetPassword.html', window.location.href).href;
                const { error } = await client.auth.resetPasswordForEmail(email, { redirectTo });
                if (error) throw error;

                requestForm.hidden = true;
                sub.textContent = '';
                showStatus('If that email has an account, a reset link is on its way. Check your inbox and spam folder, then open the link.', 'success');
            } catch (err) {
                console.error('Send reset email error:', err);
                requestError.textContent = err.message || 'Could not send the email. Please try again.';
                requestError.classList.add('show');
                requestBtn.disabled = false;
                requestBtn.textContent = 'Send reset link';
            }
        });

        /* ---------- save the new password ---------- */
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            formError.classList.remove('show');
            if (!passwordOk(pw.value) || pw.value !== confirmPw.value || !currentUser) return;

            btn.disabled = true;
            btn.textContent = 'Resetting…';

            try {
                // The password itself is stored (hashed) by Supabase Auth, never in your own tables
                const { error } = await client.auth.updateUser({ password: pw.value });
                if (error) throw error;

                // Record the change on the user's profile row
                const { error: profileError } = await client
                    .from('profiles')
                    .update({ password_changed_at: new Date().toISOString() })
                    .eq('id', currentUser.id);
                if (profileError) console.warn('Could not update profiles.password_changed_at:', profileError.message);

                form.hidden = true;
                sub.textContent = '';
                showStatus('Password reset successfully! Taking you to login…', 'success');

                // Sign out so they log in again with the new password
                try { await client.auth.signOut(); } catch (err) { console.warn(err); }
                localStorage.removeItem('isLoggedIn');
                localStorage.removeItem('careerUser');
                setTimeout(() => { window.location.href = 'Home.html'; }, 2000);
            } catch (err) {
                console.error('Reset password error:', err);
                formError.textContent = err.message || 'Something went wrong. Please try again.';
                formError.classList.add('show');
                btn.textContent = 'Reset password';
                refresh();
            }
        });

        init();
    })();
</script>
</body>
</html>
