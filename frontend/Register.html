
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareerPath | Register</title>

  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="RegisterStyleSheet.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="register-page">

  <div class="register-container">

    <!-- Registration Form -->
    <div class="form-card">

      <h2>Register</h2>
      <p class="form-subtitle">Create your CareerPath account</p>

      <form id="registerForm">

        <input
          type="text"
          id="fullname"
          placeholder="Full Name and Surname"
          autocomplete="name"
          required
        >

        <select id="role" required>
          <option value="" disabled selected>Role</option>
          <option>Student</option>
          <option>Mentor</option>
          <option>Admin</option>
          <option>Career Changer</option>
        </select>

        <input
          type="tel"
          id="cell"
          placeholder="Cell number"
          autocomplete="tel"
          required
        >

        <input
          type="email"
          id="email"
          placeholder="Email"
          autocomplete="email"
          required
        >

        <input
          type="password"
          id="password"
          placeholder="Password"
          autocomplete="new-password"
          required
        >

        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm Password"
          autocomplete="new-password"
          required
        >

        <button type="submit">Submit</button>

      </form>
    </div>

    <!-- Right Section -->
    <div class="right-section">

      <img
        src="RegisterLoggo.png"
        alt="Career illustration"
        class="registration-image"
      >

      <p class="login-link">
        Already have an account?
        <a href="#" id="toggle-login-link">Login</a>
      </p>

    </div>

  </div>

  <!-- Login Modal -->
  <div id="login-modal" class="modal">

    <div class="modal-content">

      <span class="close" role="button" tabindex="0" aria-label="Close login">&times;</span>

      <h2>Login</h2>

      <form id="loginForm">

        <input
          type="email"
          id="login-email"
          placeholder="Email"
          autocomplete="email"
          required
        >

        <input
          type="password"
          id="login-password"
          placeholder="Password"
          autocomplete="current-password"
          required
        >

        <button type="submit">Login</button>

      </form>

    </div>

  </div>

  <!-- Registration Success Toast -->
  <div id="custom-toast" class="toast-message" role="status" aria-live="polite">
    Registration successful!
  </div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="script.js"></script>

</body>
</html>
